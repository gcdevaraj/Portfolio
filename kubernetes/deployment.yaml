apiVersion: apps/v1
kind: Deployment

metadata:
  name: portfolio

spec:
  replicas: 2

  selector:
    matchLabels:
      app: portfolio

  template:
    metadata:
      labels:
        app: portfolio

    spec:
      containers:
      - name: portfolio

        image: gcdevaraj/portfolio:21

        ports:
        - containerPort: 80
